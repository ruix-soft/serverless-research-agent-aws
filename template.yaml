AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Research Agent powered by Strands Agents SDK, Amazon Bedrock, AWS Lambda Powertools and S3.

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    Environment:
      Variables:
        REPORTS_BUCKET_NAME: !Ref ReportsBucket
        RATE_LIMITS_TABLE_NAME: !Ref RateLimitsTable
        POWERTOOLS_SERVICE_NAME: serverless-research-agent
        POWERTOOLS_METRICS_NAMESPACE: ResearchAgent
        LOG_LEVEL: INFO

Resources:
  # 1. Bucket privado para almacenar los reportes de investigación
  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "serverless-research-agent-reports-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET]
            AllowedOrigins: ['*']
            MaxAge: 3600

  # 2. Tabla DynamoDB para Rate Limiting con TTL
  RateLimitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "serverless-research-agent-rate-limits-${AWS::AccountId}-${AWS::Region}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # 3. Función Lambda para Iniciar Investigación (POST /research)
  StartResearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.aws.handlers.start_research_handler.lambda_handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          WORKER_FUNCTION_NAME: !Ref ExecuteResearchWorkerFunction
      Policies:
        # Invocación asíncrona del worker
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt ExecuteResearchWorkerFunction.Arn
        # Rate Limiting atómico en DynamoDB
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:GetItem
              Resource: !GetAtt RateLimitsTable.Arn
      Events:
        StartResearchApi:
          Type: Api
          Properties:
            Path: /research
            Method: post

  # 4. Función Lambda para Consultar Estado de Investigación (GET /research/{job_id})
  GetResearchStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.aws.handlers.get_research_status_handler.lambda_handler
      Timeout: 30
      MemorySize: 256
      Policies:
        # Lectura de reportes en S3
        - S3ReadPolicy:
            BucketName: !Ref ReportsBucket
        # Rate Limiting atómico en DynamoDB
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:GetItem
              Resource: !GetAtt RateLimitsTable.Arn
      Events:
        GetResearchStatusApi:
          Type: Api
          Properties:
            Path: /research/{job_id}
            Method: get

  # 5. Función Lambda Worker para Ejecutar Agente de IA en Segundo Plano
  ExecuteResearchWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.aws.handlers.execute_research_worker_handler.lambda_handler
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          BEDROCK_MODEL_ID: "global.anthropic.claude-sonnet-4-5-20250929-v1:0"
          TAVILY_API_KEY: "{{resolve:ssm:/serverless-research-agent/tavily-api-key:1}}"
      Policies:
        # 1. Solo permisos de escritura y carga de objetos en el Bucket de Reportes
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "${ReportsBucket.Arn}/*"
        # 2. Solo permisos de inferencia para modelos de Bedrock y perfiles regionales
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - "arn:aws:bedrock:*::foundation-model/*"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"

Outputs:
  ResearchApiEndpoint:
    Description: "URL base para invocar la API del Agente Investigador"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/research"
  ReportsBucketName:
    Description: "Nombre del bucket de S3 creado para reportes"
    Value: !Ref ReportsBucket
  RateLimitsTableName:
    Description: "Nombre de la tabla DynamoDB para control de tasa (Rate Limiting)"
    Value: !Ref RateLimitsTable
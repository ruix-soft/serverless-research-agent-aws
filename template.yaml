AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Research Agent powered by Strands Agents SDK, Amazon Bedrock, AWS Step Functions, DynamoDB, AWS Lambda Powertools and S3.

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    Tracing: Active
    Environment:
      Variables:
        REPORTS_BUCKET_NAME: !Ref ReportsBucket
        RATE_LIMITS_TABLE_NAME: !Ref RateLimitsTable
        JOBS_TABLE_NAME: !Ref JobsTable
        POWERTOOLS_SERVICE_NAME: serverless-research-agent
        POWERTOOLS_METRICS_NAMESPACE: ResearchAgent
        POWERTOOLS_TRACER_CAPTURE_RESPONSE: "true"
        POWERTOOLS_TRACER_CAPTURE_ERROR: "true"
        LOG_LEVEL: INFO
  Api:
    TracingEnabled: true

Resources:
  # 1. Bucket privado para almacenar los reportes de investigación
  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "serverless-research-agent-reports-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET]
            AllowedOrigins: ['*']
            MaxAge: 3600

  # 2. Tabla DynamoDB para Rate Limiting con TTL
  RateLimitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "serverless-research-agent-rate-limits-${AWS::AccountId}-${AWS::Region}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # 3. Tabla DynamoDB para Gestión de Estado del Ciclo de Vida de Trabajos
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "serverless-research-agent-jobs-${AWS::AccountId}-${AWS::Region}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # 4. Máquina de Estados AWS Step Functions para Orquestación Resiliente
  ResearchStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "serverless-research-agent-state-machine-${AWS::AccountId}-${AWS::Region}"
      Type: STANDARD
      Tracing:
        Enabled: true
      Definition:
        Comment: "Orquestación resiliente para Agente de Investigación con persistencia en DynamoDB"
        StartAt: PutJobInProgress
        States:
          PutJobInProgress:
            Type: Task
            Resource: "arn:aws:states:::dynamodb:putItem"
            Parameters:
              TableName: !Ref JobsTable
              Item:
                pk:
                  S.$: "States.Format('JOB#{}', $.job_id)"
                id:
                  S.$: "$.job_id"
                topic:
                  S.$: "$.topic"
                status:
                  S: "IN_PROGRESS"
                created_at:
                  S.$: "$$.Execution.StartTime"
                updated_at:
                  S.$: "$$.Execution.StartTime"
            ResultPath: null
            Next: ExecuteResearchWorkerTask

          ExecuteResearchWorkerTask:
            Type: Task
            Resource: "arn:aws:states:::lambda:invoke"
            Parameters:
              FunctionName: !GetAtt ExecuteResearchWorkerFunction.Arn
              Payload:
                job_id.$: "$.job_id"
                topic.$: "$.topic"
            ResultSelector:
              job_id.$: "$.Payload.job_id"
              status.$: "$.Payload.status"
              s3_key.$: "$.Payload.s3_key"
            ResultPath: "$.worker_result"
            Retry:
              - ErrorEquals:
                  - "Lambda.ServiceException"
                  - "Lambda.AWSLambdaException"
                  - "Lambda.SdkClientException"
                  - "Lambda.TooManyRequestsException"
                IntervalSeconds: 3
                MaxAttempts: 3
                BackoffRate: 2.0
            Catch:
              - ErrorEquals:
                  - "States.ALL"
                ResultPath: "$.error_info"
                Next: MarkJobAsFailed
            Next: MarkJobAsCompleted

          MarkJobAsCompleted:
            Type: Task
            Resource: "arn:aws:states:::dynamodb:updateItem"
            Parameters:
              TableName: !Ref JobsTable
              Key:
                pk:
                  S.$: "States.Format('JOB#{}', $.job_id)"
              UpdateExpression: "SET #st = :completed, #s3 = :s3_key, #up = :updated_at"
              ExpressionAttributeNames:
                "#st": "status"
                "#s3": "s3_key"
                "#up": "updated_at"
              ExpressionAttributeValues:
                ":completed":
                  S: "COMPLETED"
                ":s3_key":
                  S.$: "$.worker_result.s3_key"
                ":updated_at":
                  S.$: "$$.Execution.StartTime"
            End: true

          MarkJobAsFailed:
            Type: Task
            Resource: "arn:aws:states:::dynamodb:updateItem"
            Parameters:
              TableName: !Ref JobsTable
              Key:
                pk:
                  S.$: "States.Format('JOB#{}', $.job_id)"
              UpdateExpression: "SET #st = :failed, #err = :error_msg, #up = :updated_at"
              ExpressionAttributeNames:
                "#st": "status"
                "#err": "error_message"
                "#up": "updated_at"
              ExpressionAttributeValues:
                ":failed":
                  S: "FAILED"
                ":error_msg":
                  S: "Error durante la ejecución del agente de investigación."
                ":updated_at":
                  S.$: "$$.Execution.StartTime"
            End: true
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - LambdaInvokePolicy:
            FunctionName: !Ref ExecuteResearchWorkerFunction

  # 5. Función Lambda para Iniciar Investigación (POST /research)
  StartResearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.aws.handlers.start_research_handler.lambda_handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref ResearchStateMachine
          WORKER_FUNCTION_NAME: !Ref ExecuteResearchWorkerFunction
      Policies:
        # Invocación de Step Functions
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Ref ResearchStateMachine
        # Rate Limiting atómico en DynamoDB
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:GetItem
              Resource: !GetAtt RateLimitsTable.Arn
      Events:
        StartResearchApi:
          Type: Api
          Properties:
            Path: /research
            Method: post

  # 6. Función Lambda para Consultar Estado de Investigación (GET /research/{job_id})
  GetResearchStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.aws.handlers.get_research_status_handler.lambda_handler
      Timeout: 30
      MemorySize: 256
      Policies:
        # Lectura de reportes en S3
        - S3ReadPolicy:
            BucketName: !Ref ReportsBucket
        # Lectura de estado de trabajos en DynamoDB
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource: !GetAtt JobsTable.Arn
        # Rate Limiting atómico en DynamoDB
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:GetItem
              Resource: !GetAtt RateLimitsTable.Arn
      Events:
        GetResearchStatusApi:
          Type: Api
          Properties:
            Path: /research/{job_id}
            Method: get

  # 7. Función Lambda Worker para Ejecutar Agente de IA en Segundo Plano
  ExecuteResearchWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.aws.handlers.execute_research_worker_handler.lambda_handler
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          BEDROCK_MODEL_ID: "global.anthropic.claude-sonnet-4-5-20250929-v1:0"
          TAVILY_API_KEY: "{{resolve:ssm:/serverless-research-agent/tavily-api-key:1}}"
      Policies:
        # 1. Solo permisos de escritura y carga de objetos en el Bucket de Reportes
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "${ReportsBucket.Arn}/*"
        # 2. Solo permisos de inferencia para modelos de Bedrock y perfiles regionales
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - "arn:aws:bedrock:*::foundation-model/*"
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"

  # 8. Dashboard Unificado de Operaciones, FinOps y Observabilidad en CloudWatch
  ResearchAgentDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "Serverless-Research-Agent-${AWS::Region}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 2,
              "properties": {
                "markdown": "# 🤖 Serverless AI Research Agent — Executive & Operational Dashboard\n**Región:** ${AWS::Region} | **Entorno:** Producción | **Metodología de Arquitectura:** Luis Ruiz (arch-core)"
              }
            },
            {
              "type": "text",
              "x": 0,
              "y": 2,
              "width": 24,
              "height": 1,
              "properties": {
                "markdown": "### 💰 1. FinOps & Consumo de IA (Amazon Bedrock Tokens)"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 3,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Bedrock", "InputTokenCount", { "stat": "Sum", "label": "Tokens Entrada (Prompt)", "color": "#1f77b4" } ],
                  [ ".", "OutputTokenCount", { "stat": "Sum", "label": "Tokens Salida (Generación)", "color": "#ff7f0e" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Consumo de Tokens en Amazon Bedrock",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 3,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Bedrock", "Invocations", { "stat": "Sum", "label": "Invocaciones Bedrock", "color": "#2ca02c" } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "title": "Invocaciones del Modelo LLM (Claude)",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 3,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  [ { "expression": "((m1 / 1000) * 0.003) + ((m2 / 1000) * 0.015)", "label": "Costo Estimado Bedrock ($ USD)", "id": "e1", "color": "#d62728" } ],
                  [ "AWS/Bedrock", "InputTokenCount", { "id": "m1", "visible": false, "stat": "Sum" } ],
                  [ "AWS/Bedrock", "OutputTokenCount", { "id": "m2", "visible": false, "stat": "Sum" } ]
                ],
                "view": "singleValue",
                "region": "${AWS::Region}",
                "title": "Costo Acumulado Estimado (FinOps)",
                "period": 86400
              }
            },
            {
              "type": "text",
              "x": 0,
              "y": 9,
              "width": 24,
              "height": 1,
              "properties": {
                "markdown": "### 📈 2. Métricas de Negocio & Casos de Uso (Powertools EMF)"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 10,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "ResearchAgent", "invocations", "service", "serverless-research-agent", "command", "StartResearchCommand", { "stat": "Sum", "label": "StartResearch (Commands)" } ],
                  [ "...", "ExecuteResearchWorkerCommand", { "stat": "Sum", "label": "ExecuteWorker (Commands)" } ],
                  [ "ResearchAgent", "invocations", "service", "serverless-research-agent", "query", "GetResearchStatusQuery", { "stat": "Sum", "label": "GetStatus (Queries)" } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "title": "Invocaciones por Caso de Uso (CQRS)",
                "period": 60
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 10,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "ResearchAgent", "latency", "service", "serverless-research-agent", "command", "StartResearchCommand", { "stat": "p90", "label": "p90 StartResearch" } ],
                  [ "...", "ExecuteResearchWorkerCommand", { "stat": "p90", "label": "p90 ExecuteWorker" } ],
                  [ "ResearchAgent", "latency", "service", "serverless-research-agent", "query", "GetResearchStatusQuery", { "stat": "p90", "label": "p90 GetStatus" } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "title": "Latencia p90 por Caso de Uso (ms)",
                "period": 60
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 10,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "ResearchAgent", "errors", "service", "serverless-research-agent", "command", "StartResearchCommand", { "stat": "Sum", "label": "Errores StartResearch", "color": "#d62728" } ],
                  [ "...", "ExecuteResearchWorkerCommand", { "stat": "Sum", "label": "Errores ExecuteWorker", "color": "#ff9896" } ],
                  [ "ResearchAgent", "errors", "service", "serverless-research-agent", "query", "GetResearchStatusQuery", { "stat": "Sum", "label": "Errores GetStatus", "color": "#9467bd" } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "title": "Errores de Dominio / Infraestructura",
                "period": 60
              }
            },
            {
              "type": "text",
              "x": 0,
              "y": 16,
              "width": 24,
              "height": 1,
              "properties": {
                "markdown": "### ⚡ 3. Infraestructura Serverless & Orquestación (Step Functions + Lambda + API Gateway)"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 17,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/States", "ExecutionsSucceeded", "StateMachineArn", "${ResearchStateMachine}", { "stat": "Sum", "label": "Éxitos SFN", "color": "#2ca02c" } ],
                  [ ".", "ExecutionsFailed", ".", ".", { "stat": "Sum", "label": "Fallos SFN", "color": "#d62728" } ],
                  [ ".", "ExecutionsTimedOut", ".", ".", { "stat": "Sum", "label": "Timeouts SFN", "color": "#ff7f0e" } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "title": "Ejecuciones Step Functions",
                "period": 60
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 17,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Duration", "FunctionName", "${StartResearchFunction}", { "stat": "Average", "label": "Avg Dur StartFn" } ],
                  [ ".", ".", "FunctionName", "${GetResearchStatusFunction}", { "stat": "Average", "label": "Avg Dur StatusFn" } ],
                  [ ".", ".", "FunctionName", "${ExecuteResearchWorkerFunction}", { "stat": "Average", "label": "Avg Dur WorkerFn" } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "title": "Duración Promedio Lambdas (ms)",
                "period": 60
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 17,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/ApiGateway", "Count", "ApiName", "${ServerlessRestApi}", { "stat": "Sum", "label": "Total Requests" } ],
                  [ ".", "4XXError", ".", ".", { "stat": "Sum", "label": "4xx Errors (inc. 429)", "color": "#ff7f0e" } ],
                  [ ".", "5XXError", ".", ".", { "stat": "Sum", "label": "5xx Server Errors", "color": "#d62728" } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "title": "Peticiones y Errores API Gateway",
                "period": 60
              }
            },
            {
              "type": "text",
              "x": 0,
              "y": 23,
              "width": 24,
              "height": 1,
              "properties": {
                "markdown": "### 🛡️ 4. Rate Limiting & Persistencia (DynamoDB + S3)"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 24,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${JobsTable}", { "stat": "Sum", "label": "RCU JobsTable" } ],
                  [ ".", "ConsumedWriteCapacityUnits", ".", ".", { "stat": "Sum", "label": "WCU JobsTable" } ],
                  [ ".", "ConsumedReadCapacityUnits", "TableName", "${RateLimitsTable}", { "stat": "Sum", "label": "RCU RateLimitsTable" } ],
                  [ ".", "ConsumedWriteCapacityUnits", ".", ".", { "stat": "Sum", "label": "WCU RateLimitsTable" } ]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "title": "Consumo DynamoDB (RCU / WCU)",
                "period": 60
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 24,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/S3", "NumberOfObjects", "BucketName", "${ReportsBucket}", "StorageType", "AllStorageTypes", { "stat": "Average", "label": "Reportes Almacenados" } ],
                  [ ".", "BucketSizeBytes", ".", ".", ".", ".", { "stat": "Average", "label": "Tamaño Total Bucket (Bytes)" } ]
                ],
                "view": "singleValue",
                "region": "${AWS::Region}",
                "title": "Almacenamiento en S3 (Reports)",
                "period": 86400
              }
            }
          ]
        }

Outputs:
  ResearchApiEndpoint:
    Description: "URL base para invocar la API del Agente Investigador"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/research"
  ReportsBucketName:
    Description: "Nombre del bucket de S3 creado para reportes"
    Value: !Ref ReportsBucket
  RateLimitsTableName:
    Description: "Nombre de la tabla DynamoDB para control de tasa (Rate Limiting)"
    Value: !Ref RateLimitsTable
  JobsTableName:
    Description: "Nombre de la tabla DynamoDB para ciclo de vida de trabajos"
    Value: !Ref JobsTable
  StateMachineArn:
    Description: "ARN de la máquina de estados de Step Functions"
    Value: !Ref ResearchStateMachine
  DashboardName:
    Description: "Nombre del Dashboard Unificado en Amazon CloudWatch"
    Value: !Ref ResearchAgentDashboard
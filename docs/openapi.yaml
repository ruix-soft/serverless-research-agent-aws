openapi: 3.0.3
info:
  title: Serverless AI Research Agent API
  description: >
    API REST para solicitar y consultar investigaciones técnicas profundas automatizadas.
    Construida sobre AWS Serverless (API Gateway, AWS Lambda, Amazon S3), Amazon Bedrock
    (patrón ReAct con Claude Sonnet 4.5 / Strands SDK) y Tavily Web Search API.
    Sigue una arquitectura en dos capas (Presentación y Contexto) con CQRS, Hexagonal y
    patrón asíncrono basado en eventos (Event-Driven Polling).
  version: 2.0.0
servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com/Prod
    description: Amazon API Gateway REST API Deployment
    variables:
      apiId:
        default: abcdef123
        description: Identificador de la API REST en API Gateway
      region:
        default: us-east-1
        description: Región de despliegue de AWS
paths:
  /research:
    post:
      summary: Iniciar una investigación técnica asíncrona
      description: >
        Valida los parámetros de entrada, genera un `job_id` único e invoca la función Lambda
        worker en segundo plano de forma asíncrona. Retorna inmediatamente HTTP 202 con la URL
        para consultar el progreso del reporte.
      operationId: startResearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartResearchRequest'
      responses:
        '202':
          description: Solicitud de investigación aceptada y puesta en marcha en segundo plano.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartResearchResponse'
        '400':
          description: Parámetros de solicitud inválidos o JSON malformado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorResponse'
        '500':
          description: Error interno del servidor o fallo de invocación de infraestructura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorResponse'

  /research/{job_id}:
    get:
      summary: Consultar el estado de una investigación y obtener el reporte
      description: >
        Verifica si el reporte Markdown generado por el agente de IA ya está disponible en Amazon S3.
        Si la investigación terminó, retorna HTTP 200 con una URL presignada temporal (1 hora de validez).
        Si continúa ejecutándose, retorna el estado IN_PROGRESS.
      operationId: getResearchStatus
      parameters:
        - name: job_id
          in: path
          required: true
          description: Identificador UUID único de la investigación generada en el POST inicial.
          schema:
            type: string
            format: uuid
            example: "8f0a2c3a-23ef-4b2a-8742-fa32c748c901"
      responses:
        '200':
          description: Estado actual del trabajo de investigación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResearchStatusResponse'
        '400':
          description: Parámetro `job_id` no proporcionado o inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorResponse'
        '404':
          description: Trabajo de investigación o recurso no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorResponse'
        '500':
          description: Error interno en la consulta del almacenamiento S3.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorResponse'

components:
  schemas:
    StartResearchRequest:
      type: object
      required:
        - topic
      properties:
        topic:
          type: string
          description: Tema o interrogante técnica a investigar en profundidad.
          example: "Arquitecturas Serverless y Modelos ReAct en AWS 2026"
        depth:
          type: string
          description: Nivel de profundidad del análisis del agente.
          enum: [quick, detailed, exhaustive]
          default: detailed
          example: "detailed"
        format:
          type: string
          description: Formato de salida del reporte final.
          enum: [markdown, json]
          default: markdown
          example: "markdown"
        search_limit:
          type: integer
          description: Límite máximo de búsquedas web a realizar con Tavily.
          default: 5
          example: 5

    StartResearchResponse:
      type: object
      required:
        - job_id
        - status
        - message
        - status_url
      properties:
        job_id:
          type: string
          format: uuid
          description: Identificador único asignado al trabajo de investigación.
          example: "8f0a2c3a-23ef-4b2a-8742-fa32c748c901"
        status:
          type: string
          enum: [IN_PROGRESS]
          description: Estado inicial de la tarea.
          example: "IN_PROGRESS"
        message:
          type: string
          description: Mensaje informativo del estado de aceptación.
          example: "Investigación iniciada exitosamente."
        status_url:
          type: string
          description: Ruta relativa para consultar el estado del trabajo.
          example: "/research/8f0a2c3a-23ef-4b2a-8742-fa32c748c901"

    GetResearchStatusResponse:
      type: object
      required:
        - job_id
        - status
      properties:
        job_id:
          type: string
          format: uuid
          description: Identificador del trabajo consultado.
          example: "8f0a2c3a-23ef-4b2a-8742-fa32c748c901"
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETED, FAILED]
          description: Estado de ejecución del agente.
          example: "COMPLETED"
        message:
          type: string
          description: Detalle del estado del trabajo.
          example: "Investigación completada exitosamente."
        s3_report_url:
          type: string
          format: uri
          nullable: true
          description: URL presignada regional de Amazon S3 para descargar el reporte Markdown (expira en 1 hora).
          example: "https://serverless-research-agent-reports-bucket.s3.mx-central-1.amazonaws.com/reports/8f0a2c3a-23ef-4b2a-8742-fa32c748c901.md?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Expires=3600"

    DomainErrorResponse:
      type: object
      required:
        - type
        - message
      properties:
        type:
          type: string
          description: Tipo o código estandarizado del error de dominio.
          example: "validation"
        message:
          type: string
          description: Descripción legible del motivo del error.
          example: "El campo 'topic' es obligatorio y no puede estar vacío."
        data:
          type: object
          additionalProperties: true
          description: Atributos o contexto adicional del error.
          example:
            details:
              field: "topic"